name: Production smoke test

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create self-contained test report
        shell: bash
        run: |
          mkdir -p smoke-report
          cp test-fixtures/smoke-report.html smoke-report/index.html

      - name: Publish test report
        id: publish-report
        uses: ./
        with:
          report-path: smoke-report/index.html
          ttl-hours: "1"
          report-name: Ephemeral Pages Action smoke test
          github-token: ${{ github.token }}

      - name: Verify outputs
        env:
          PAGE_ID: ${{ steps.publish-report.outputs.page-id }}
          PAGE_URL: ${{ steps.publish-report.outputs.page-url }}
          EXPIRES_AT: ${{ steps.publish-report.outputs.expires-at }}
          COMMENT_ID: ${{ steps.publish-report.outputs.comment-id }}
        shell: bash
        run: test -n "$PAGE_ID" && test -n "$PAGE_URL" && test -n "$EXPIRES_AT" && test -n "$COMMENT_ID"
